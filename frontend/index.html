<!DOCTYPE html>
<html>
<head>
    <title>Student Registration System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="text-center">
                Student Registration System
            </h2>

        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-4">
                    <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Enter Name">
                </div>

                <div class="col-md-4">
                    <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter Email">
                </div>

                <div class="col-md-4">

                    <select
                    id="course"
                    class="form-control">

                        <option value="">
                            Select Course
                        </option>

                        <option>CSE</option>
                        <option>ISE</option>
                        <option>AIML</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>MECH</option>

                    </select>

                </div>

            </div>

            <div class="mt-3">

                <button
                id="submitBtn"
                onclick="addStudent()"
                class="btn btn-success">

                    Add Student

                </button>

            </div>

        </div>

    </div>

    <div class="mt-4">

        <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Search Student..."
        onkeyup="searchStudents()">

    </div>

    <h4
    id="studentCount"
    class="mt-3">

        Total Students: 0

    </h4>

    <div class="row justify-content-center mb-4">

    <div class="col-md-4">

        <div class="card text-bg-primary">

            <div class="card-body text-center">

                <h5>Total Students</h5>

                <h3 id="totalCard">0</h3>

            </div>

        </div>

    </div>
    </div>

    <div class="row g-4 justify-content-center">
    <div class="col-md-4">
    <div class="card text-bg-success">
        <div class="card-body text-center">
            <h5>CSE</h5>
            <h3 id="cseCount">0</h3>
        </div>
    </div>
    </div>


<div class="col-md-4">
    <div class="card text-bg-info">
        <div class="card-body text-center">
            <h5>ISE</h5>
            <h3 id="iseCount">0</h3>
        </div>
    </div>
</div>

<div class="col-md-4">
    <div class="card text-bg-warning">
        <div class="card-body text-center">
            <h5>AIML</h5>
            <h3 id="aimlCount">0</h3>
        </div>
    </div>
</div>

<div class="col-md-4">
    <div class="card text-bg-danger">
        <div class="card-body text-center">
            <h5>ECE</h5>
            <h3 id="eceCount">0</h3>
        </div>
    </div>
</div>

<div class="col-md-4">
    <div class="card text-bg-secondary">
        <div class="card-body text-center">
            <h5>EEE</h5>
            <h3 id="eeeCount">0</h3>
        </div>
    </div>
</div>

<div class="col-md-4">
    <div class="card text-bg-dark">
        <div class="card-body text-center">
            <h5>MECH</h5>
            <h3 id="mechCount">0</h3>
        </div>
    </div>
</div>

</div>

    <div class="table-responsive mt-3">

        <table
        class="table table-striped table-hover">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Registered On</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

    <footer
    class="text-center mt-4 text-muted">

        Student Registration System © 2026

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
